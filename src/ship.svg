<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 647" width="846" height="647">
<!-- "How I ship in 2026" from rcmadeloso.com as a four-panel rage comic. Each face is a
     placeholder in src/memes: replace the file, run build.py, and the panel updates.
     A picture of any shape is fitted and centred in its 320 by 176 box. -->
<style>
  .l { fill: none; stroke: #000; stroke-width: 3; }
  .cap { fill: #fff; stroke: #000; stroke-linejoin: round; paint-order: stroke; }
</style>
<rect width="846" height="647" fill="#fff"/>
<g transform="translate(3 3)">
  <g shape-rendering="crispEdges">
    <rect class="l" x="1.5" y="1.5" width="837" height="638"/>
    <rect x="0" y="104" width="840" height="3"/>
    <rect x="0" y="371" width="840" height="3"/>
    <rect x="418.5" y="107" width="3" height="532"/>
  </g>
  <text x="28" y="60" font-size="46" data-font="anton">HOW I SHIP IN 2026</text>
  <text x="28" y="89" font-size="20" data-font="comic" data-fit="784">Agents do the heavy lifting. I own the architecture, the standards and the final review.</text>

  <!-- 1: the plan -->
  <text x="211" y="145" font-size="21" text-anchor="middle">I write the plan</text>
  <text x="211" y="171" font-size="21" text-anchor="middle">and the guardrails.</text>
  <image href="{{img:memes/ship-1-plan.png:480}}" x="51" y="189" width="320" height="176"/>

  <!-- 2: the agents build -->
  <text x="629" y="145" font-size="21" text-anchor="middle">Agents build it</text>
  <text x="629" y="171" font-size="21" text-anchor="middle">with my custom skills.</text>
  <image href="{{img:memes/ship-2-build.png:480}}" x="469" y="189" width="320" height="176"/>

  <!-- 3: the reviewers try to break it -->
  <text x="211" y="412" font-size="21" text-anchor="middle">Reviewer agents</text>
  <text x="211" y="438" font-size="21" text-anchor="middle">try to break it.</text>
  <image href="{{img:memes/ship-3-review.png:480}}" x="51" y="456" width="320" height="176"/>
  <text class="cap" x="211" y="626" font-size="32" text-anchor="middle" data-font="anton" data-stroke="0.15">Y U NO PASS</text>

  <!-- 4: verify, test, ship -->
  <text x="629" y="412" font-size="21" text-anchor="middle">I verify, test</text>
  <text x="629" y="438" font-size="21" text-anchor="middle">and ship.</text>
  <image href="{{img:memes/ship-4-ship.png:480}}" x="469" y="456" width="320" height="176"/>
  <text class="cap" x="629" y="626" font-size="32" text-anchor="middle" data-font="anton" data-stroke="0.15">SHIP IT</text>
</g>
</svg>
