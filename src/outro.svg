<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 259" width="846" height="259">
<!-- The site's "Say hi" close, with its "Y U no send me an email" meme. The face is a
     placeholder: replace src/memes/say-hi.png, run build.py, and it updates.
     A picture of any shape is fitted and centred in its 194 by 164 box. -->
<style>
  .l { fill: none; stroke: #000; stroke-width: 3; }
  .cap { fill: #fff; stroke: #000; stroke-linejoin: round; paint-order: stroke; }
</style>
<rect width="846" height="259" fill="#fff"/>
<g transform="translate(3 3)">
  <image href="{{img:memes/say-hi.png:420}}" x="28" y="50" width="194" height="164"/>
  <text class="cap" x="126.5" y="48" font-size="38" text-anchor="middle" data-font="anton" data-stroke="0.15">Y U NO</text>
  <text class="cap" x="126.5" y="238" font-size="32" text-anchor="middle" data-font="anton" data-stroke="0.15" data-fit="226">SEND ME AN EMAIL</text>

  <text x="285" y="78" font-size="60" data-font="anton">SAY HI</text>
  <text x="285" y="110" font-size="20" data-font="comic">Laravel and Vue.js, from requirements to deployment.</text>
  <text x="285" y="136" font-size="20" data-font="comic">One email away.</text>
  <text x="285" y="190" font-size="44" data-font="anton">job@rcmadeloso.com</text>
  <text x="285" y="230" font-size="16" data-font="comic">Ramil Christopher Madeloso · Dumaguete, PH · Remote</text>

  <g shape-rendering="crispEdges">
    <rect x="285" y="197" width="391" height="3"/>
    <rect x="250" y="3" width="3" height="247"/>
    <rect class="l" x="1.5" y="1.5" width="837" height="250"/>
  </g>
</g>
</svg>
