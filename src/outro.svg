<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 259" width="846" height="259">
<!-- The site's "Say hi" close. Its "Y U no send me an email" meme, drawn here as an
     original character: an envelope with its arms up. -->
<style>
  .l { fill: none; stroke: #000; stroke-width: 3; }
  .d { fill: none; stroke: #000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .paper { fill: #fff; }
  .ink { fill: #000; }
  .cap { fill: #fff; stroke: #000; stroke-linejoin: round; paint-order: stroke; }
</style>
<rect width="846" height="259" fill="#fff"/>
<g transform="translate(3 3)">
  <g class="d">
    <path d="M56 146l-24-16 4-34M36 96l-10-10M36 96l0-14M36 96l10-9"/>
