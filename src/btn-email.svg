<path d="M5 6l8 0 11 1 9 0 10-1 10 1 10-2 10 1 11 0 9 0 10-1 8 1 0 8 0 10 0 10-3 5-8-1-10 1-11-1-10 0-10 1-9 0-11 0-10 0-9-1-11 0-5-2 1-10 0-10zM1 16l0 10 0 12 8 4 10-1 10 1 10 0 11 1 9-1 10 0 10 0 11 1 10-1 10 1 5-8 0-11-1-10 0-10-11-2-10 1-9 0-10 0-11-1-10 1-10 0-10 0-9 0-11-1-10 2z" fill="#111" fill-rule="evenodd"/>
<text x="58.0" y="28.5" font-size="18" data-font="comicb" text-anchor="middle">Email me</text>
