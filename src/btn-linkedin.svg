<path d="M6 5l8 1 10-1 11 1 9-1 11 0 10 0 10 0 10-1 10 0 8 0 3 6-1 9 1 10 0 9-8 0-11 1-10 0-10 0-10 0-9 0-11 0-9-1-11 1-8 0-3-6 1-10-1-9zM3 14l0 9-1 10 5 9 10 0 11 0 9 0 11 0 9 0 10 0 10 0 10 0 11-1 10-1 1-11-1-10 1-10-4-8-11 0-9 0-10 1-10 0-10 0-11-1-9 1-11 0-10 1-10 0z" fill="#111" fill-rule="evenodd"/>
<text x="55.5" y="28.5" font-size="18" data-font="comicb" text-anchor="middle">LinkedIn</text>
</g>
